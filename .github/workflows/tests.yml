name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the development environment
        run: python -m pip install -r requirements-lock.txt
      - name: Lint
        run: python -m ruff check src tools packaging
      - name: Architecture metrics
        run: python tools/architecture_metrics.py --root . --no-clones
      - name: Tests
        working-directory: src
        run: python -m pytest -q -p no:cacheprovider
